name: Daily Tamil Content Draft and Short Render

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *" # 08:00 Asia/Kolkata (UTC+05:30)

permissions:
  contents: read

jobs:
  create-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and Tamil font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Generate three rotating Tamil Shorts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          TAMIL_TTS_VOICE: ta-IN-PallaviNeural
        run: python -m src.daily_batch --count 3
      - name: Save draft, visuals and video artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mabolo-tamil-youtube-short
          path: |
            output/*.json
            output/*.mp3
            output/*.srt
            output/*.png
            output/*.jpg
            output/*.mp4
            output/*.html
          if-no-files-found: error
          retention-days: 14
